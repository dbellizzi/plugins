name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifests parse
        run: for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do jq -e . "$f" >/dev/null; done
      - name: Both marketplaces list the same plugins and sources
        run: |
          c=$(jq -S '[.plugins[] | {name, source}] | sort_by(.name)' .claude-plugin/marketplace.json)
          x=$(jq -S '[.plugins[] | {name, source}] | sort_by(.name)' .agents/plugins/marketplace.json)
          [ "$c" = "$x" ] || { echo "Claude and Codex marketplaces disagree:"; diff <(echo "$c") <(echo "$x"); exit 1; }
